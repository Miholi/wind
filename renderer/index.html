<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>AI Web</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">

    <!-- ============ 网页主区 ============ -->
    <section id="webview-view">
      <div id="webview-wrap">
        <!-- 启动/加载过渡页：BrowserView 未挂载或加载中时显示 -->
        <div id="webview-loading" class="splash">
          <!-- 照片背景 + 可读性遮罩（图片由 originals/angen-src.jpg 美化生成） -->
          <div class="splash-backdrop" aria-hidden="true"></div>
          <div class="splash-scrim" aria-hidden="true"></div>
          <div class="splash-badge">
            <div class="splash-ring"></div>
            <img id="loading-avatar" class="splash-logo" src="img/platform-1.png" alt="AI Web" draggable="false" />
          </div>
          <div class="splash-name">AI Web</div>
          <div id="loading-text" class="splash-status">正在连接 DeepSeek…</div>
        </div>
      </div>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
